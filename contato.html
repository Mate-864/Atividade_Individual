<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafézes</title>
    <link rel="stylesheet" href="Estilo/style.css">
</head>
<body>
    <header>
        <h1>Cafeteria Cafézes</h1>
        <p>Aqui temos os melhores cafés de toda a cidade!</p>

        <nav>
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="servicos.html">Serviços</a>
            <a href="planos.html">Cardápio</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Entre em contato</h2>

            <form>
                <label for="nome">Nome:</label>
                <input type="txt" id="nome" name="nome" required placeholder="Digite seu nome aqui">

                <label for="Email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="Digite seu e-mail aqui">

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required placeholder="Digite seu telefone aqui">

                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione uma opção</option>
                    <option value="">Dúvida</option>
                    <option value="">Localizações</option>
                    <option value="">Outro</option>
                </select>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem aqui (caso tenha)"></textarea>

                <button type="submit">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>1945 Cafézes™. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
